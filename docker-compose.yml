services:
  postgres:
    image: postgres:17-alpine
    container_name: regulei-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-regulei_db}
      POSTGRES_USER: ${DB_USER:-regulei_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-troque_esta_senha_local
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - regulei_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-regulei_user} -d ${DB_NAME:-regulei_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  regulei_pgdata: